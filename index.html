<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let words = ["кошка", "машина", "ребенок", "весна", "солнце", "шляпа"]
        let word = words[Math.floor(Math.random() * words.length)]
        let answerArray = []
        for (let i = 0; i < word.length; i++) {
            answerArray[i] = '_'
        }
        let remainingLetters = word.length
        let trying = 10

        while (remainingLetters > 0 && trying > 0) {
            alert(answerArray.join(' '))
            let guess = prompt('Угадайте слово или нажмите Отмена для выхода из игры')
            guess = guess.toLowerCase();
            if (guess === null) {
                break
            } else if (guess.length !== 1) {
                alert('Пожалуйста введите только одну букву')
            } else if (answerArray.includes(guess)) {
                alert('Вы уже угадали эту букву! Попробуйте другую.');
            }
            else {
                let correctGuess = false;
                for (let j = 0; j < word.length; j++) {
                    if (word[j] === guess && answerArray[j] === '_') {
                        answerArray[j] = guess
                        remainingLetters--
                        correctGuess = true;
                    }
                }
                if (!correctGuess) {
                    trying--;
                    alert('Неверно! Минус одна попытка.');
                } else {
                    alert('Отлично! Есть такая буква.');
                }
            }

        }
        alert(answerArray.join(' '))
        if (remainingLetters === 0) {
            alert('Поздравляем! Вы победили!');
        } else {
            alert('Попытки закончились. Вы проиграли.');
        }
        alert('Было загадано слово: ' + word);

    </script>
</body>

</html>
