<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let words = ["кошка", "машина", "ребенок", "весна", "солнце", "шляпа"]
        function pickWord(array) {
            return array[Math.floor(Math.random() * array.length)]
        }
        function setupAnswerArray(value) {
            let arr = []
            for (let i = 0; i < value.length; i++) {
                arr[i] = '_'
            }
            return arr
        }
        function showPlayerProgress(arr) {
            alert(arr.join(' '))
        }
        function getGuess() {
           return prompt('Угадайте слово или нажмите Отмена для выхода из игры')
        }
        let updateGameState = function (guess, word, answerArray) {
            let appearances = 0;
            for (let j = 0; j < word.length; j++) {
                if (word[j] === guess) {
                    answerArray[j] = guess;
                    appearances++;
                }
            }

            return appearances;
        };

        let showAnswerAndCongratulatePlayer = function (answerArray) {
            showPlayerProgress(answerArray);
            alert("Good job! The answer was " + answerArray.join(""));
        };
        let word = pickWord(words)
        let answerArray = setupAnswerArray(word)

        let remainingLetters = word.length


        while (remainingLetters > 0) {
            showPlayerProgress(answerArray); 
            let guess = getGuess();
            if (guess === null) {
                break;
            } else if (guess.length !== 1) {
                alert("Please enter a single letter.");
            } else {
                let correctGuesses = updateGameState(guess, word, answerArray);
                remainingLetters -= correctGuesses;
            }
        }

        showAnswerAndCongratulatePlayer(answerArray);


    </script>
</body>

</html>
